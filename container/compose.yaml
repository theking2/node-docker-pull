services:
  app-two:
    image: node:20-alpine
    container_name: node-app-two
    restart: unless-stopped
    working_dir: /usr/src/app
    user: "1000:1000"
    group_add:
      - "985"                                          # ← host docker GID
    volumes:
      - /pool0/storage/node-apps/app-two:/usr/src/app
      - /var/run/docker.sock:/var/run/docker.sock      # ← add this line
    ports:
      - "3334:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - APP_NAME=app-two
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    command: sh -c "npm install --omit=dev && npm start"
    networks:
      - node-net

networks:
  node-net:
    driver: bridge